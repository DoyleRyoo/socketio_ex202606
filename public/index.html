<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="chat-panel" aria-label="Socket.IO chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Socket.IO</p>
            <h1>Realtime Chat</h1>
          </div>
          <span id="status" class="status">Connecting</span>
        </header>

        <form id="name-form" class="name-form">
          <label for="username">Name</label>
          <input id="username" name="username" maxlength="24" placeholder="Enter your name">
          <button type="submit">Set</button>
        </form>

        <ol id="messages" class="messages" aria-live="polite"></ol>

        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message">Message</label>
          <input id="message" name="message" maxlength="500" autocomplete="off" placeholder="Type a message">
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
